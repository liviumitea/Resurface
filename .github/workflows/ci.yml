name: Validate

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo export --platform ios --output-dir /tmp/resurface-ios-export
      - run: npx expo export --platform android --output-dir /tmp/resurface-android-export

  # Compiles the native Android project (SQLCipher, Expo modules) from a clean prebuild.
  # JavaScript bundling is covered by the app job; this only proves the native build.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - working-directory: android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon

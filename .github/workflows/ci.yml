name: Validate

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo export --platform ios --output-dir /tmp/resurface-ios-export
      - run: npx expo export --platform android --output-dir /tmp/resurface-android-export
